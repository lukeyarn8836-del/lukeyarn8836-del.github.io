<script>

    function wrapIndex(index, length) {
        if (index >= length) {
            return 0;
        }

        if (index < 0) {
            return length - 1;
        }

        return index;
    }


    /* =========================
       ATLAS
    ========================== */

    const atlasImages = [
        {
            src: "./images/ATLAS_5_1.png",
            label: "ATLAS 5"
        },
        {
            src: "./images/ATLAS_5_2.png",
            label: "ATLAS 5"
        },
        {
            src: "./images/ATLAS_4_1.png",
            label: "ATLAS 4"
        },
        {
            src: "./images/ATLAS_4_2.png",
            label: "ATLAS 4"
        },
        {
            src: "./images/ATLAS_3_1.png",
            label: "ATLAS 3"
        },
        {
            src: "./images/ATLAS_3_2.png",
            label: "ATLAS 3"
        },
        {
            src: "./images/ATLAS_2_1.png",
            label: "ATLAS 2"
        },
        {
            src: "./images/ATLAS_1_1.png",
            label: "ATLAS 1"
        }
    ];

    let atlasIndex = 0;

    function changeAtlasSlide(direction) {
        atlasIndex = wrapIndex(
            atlasIndex + direction,
            atlasImages.length
        );

        document.getElementById("atlas-image").src =
            atlasImages[atlasIndex].src;

        document.getElementById("atlas-label").textContent =
            atlasImages[atlasIndex].label;

        document.getElementById("atlas-count").textContent =
            (atlasIndex + 1) + " / " + atlasImages.length;
    }
